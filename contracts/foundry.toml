[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.29"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "reactive-lib/=lib/reactive-lib-omni/src/",
]

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC}"
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC}"
lasna = "https://lasna-rpc.rnk.dev/"
